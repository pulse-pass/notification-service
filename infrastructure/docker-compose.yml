name: notification-service-test

services:
  mysql:
    image: mysql:8.0
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-notification-service-test}-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pulse-pass

  redis:
    image: redis:7.4
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-notification-service-test}-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pulse-pass

  kafka:
    image: apache/kafka:3.9.1
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-notification-service-test}-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:${KAFKA_PORT},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${SERVICE_PREFIX:-notification-service-test}-kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - pulse-pass

  mockserver:
    image: mockserver/mockserver:5.15.0
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-notification-service-test}-mockserver
    ports:
      - "${MOCKSERVER_PORT}:1080"
    networks:
      - pulse-pass

  notification_event-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${SERVICE_PREFIX:-notification-service-test}-notification_event-consumer
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: notification_event-consumer
      MYSQL_HOST: ${MYSQL_HOST:-notification-service-test-mysql}
      MYSQL_PORT: 3306
      KAFKA_URL: ${KAFKA_URL:-${KAFKA_TEST_URL}}
      REDIS_URL: ${REDIS_URL:-${REDIS_TEST_URL}}
      MAILTRAP_URL: ${MAILTRAP_URL:-${MAILTRAP_TEST_URL}}
      NOTIFICATION_EVENT_RETRY_DELAY: ${NOTIFICATION_EVENT_RETRY_DELAY:-500}
    cap_add:
      - SYS_TIME
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/notification_event-consumer.ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
