spring.application.name=notification-service

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3309}/${MYSQL_DATABASE:notification}
spring.datasource.username=${MYSQL_USER:notification}
spring.datasource.password=${MYSQL_PASSWORD:notification}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9095}
spring.kafka.consumer.group-id=notification-service-notification_event-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.data.redis.url=${REDIS_URL:redis://localhost:6381}

spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s

app.mailtrap.url=${MAILTRAP_URL:}
app.mailtrap.api-token=${MAILTRAP_API_TOKEN}
app.mailtrap.sandbox-id=${MAILTRAP_SANDBOX_ID}
app.mail.from-email=${MAIL_FROM_EMAIL}
app.mail.from-name=${MAIL_FROM_NAME}

app.notification-event.retry.delay=${NOTIFICATION_EVENT_RETRY_DELAY:60000}
app.notification-event.retry.max-attempts=10081

app.consumers.notification-event=false
app.consumers.ready-file=/tmp/notification_event-consumer.ready
