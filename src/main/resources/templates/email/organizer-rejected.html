<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>PulsePass</title>
</head>
<body style="margin:0;padding:0;background-color:#E5E5E5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E5E5E5;">
<tr>
<td align="center" style="padding:32px 16px;">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
<tr>
<td style="padding:0 8px 16px 8px;font-family:'Familjen Grotesk',Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#2B2D31;">PulsePass</td>
</tr>
<tr>
<td style="background-color:#FFFFFF;border-radius:12px;padding:32px;font-family:'Familjen Grotesk',Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#2B2D31;">
<p style="margin:0 0 16px 0;font-size:20px;line-height:28px;font-weight:bold;color:#2B2D31;">Olá, <span th:text="${recipient_name}">Maria</span></p>
<p style="margin:0 0 16px 0;color:#2B2D31;">O cadastro da <strong th:text="${legal_name}">Eventos Silva LTDA</strong> foi reprovado.</p>
<p style="margin:0 0 16px 0;color:#2B2D31;"><strong>Motivo:</strong> <span th:text="${rejection_reason_description}">Motivo da reprovação</span></p>
<p style="margin:0 0 24px 0;color:#2B2D31;">Revise os dados informados no cadastro. Se tiver dúvidas sobre a decisão, entre em contato com a gente.</p>
<p style="margin:0;color:#2B2D31;">PulsePass</p>
</td>
</tr>
<tr>
<td style="padding:16px 8px 0 8px;font-family:'Familjen Grotesk',Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#2B2D31;">Esta é uma mensagem automática do PulsePass. Não responda a este e-mail.</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
